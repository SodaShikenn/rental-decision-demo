# Test the front end and the server, and check that the Docker setup builds, on every push and PR.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:web

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install server dependencies (CPU-only PyTorch first, as in the Dockerfile)
        run: |
          python -m venv server/.venv
          server/.venv/bin/pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
          server/.venv/bin/pip install -r server/requirements-dev.txt
      - run: npm run test:server

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build --tag rental-helper-api server
      - name: Validate the compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Validate the production compose file
        env:
          RENTAL_ENV_FILE: .env.production.example
        run: docker compose --env-file docker/.env.production.example -f docker/compose.production.yml config --quiet
      - name: Validate the HTTPS proxy configuration
        run: docker run --rm -e RENTAL_DOMAIN=localhost -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
