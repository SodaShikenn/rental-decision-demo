# Publish the video to GitHub Pages; the complete app is self-hosted. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "scripts/configure-pages.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test front end
        run: npm run test:web
      - name: Assemble the video site
        run: |
          mkdir -p _site/static
          cp -R web/demo _site/demo
          cp web/static/favicon.svg _site/static/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=demo/"><title>Rental Helper</title><a href="demo/">Watch the walkthrough</a></html>' > _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
