# Serves web/ and proxies the API, so browser and API share one origin (no CORS round trips).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 5 MB by the API; leave room for multipart framing.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bounded review searches can take up to 180 seconds.
        proxy_read_timeout 200s;
    }

    location ~ ^/(healthz|docs|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Front-end unit tests are not part of the site.
    location /tests/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
